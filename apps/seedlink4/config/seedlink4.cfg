# TCP port for SeedLink connections. By default
# the SeedLink standard port 18000 will be used.
port = 18000

# Location of storage.
filebase = @ROOTDIR@/var/lib/seedlink4

# Number of segments per station.
segments = 10

# Segment size in records.
segsize = 1000

# Maximum record size in bytes, including
# metadata header.
recsize = 1024

# Time index granularity in seconds.
granularity = 600
